 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeVerse</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

a:hover{
    color:blue;
}

body{
    background:white;
}

nav{
    height:70px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:0 50px;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

nav ul{
    display:flex;
    list-style:none;
    gap:30px;
}

nav ul li a{
    text-decoration:none;
    color:black;
    font-weight:bold;
}

.notification{
    position:relative;
}

.notification i{
    font-size:28px;
}

.badge{
    position:absolute;
    top:-8px;
    right:-10px;
    width:20px;
    height:20px;
    border-radius:50%;
    background:red;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:12px;
    font-weight:bold;
}

.container{
    display:flex;
    justify-content:center;
    align-items:center;
    height:calc(100vh - 70px);
    background-image:url("images (1).jpg");
    background-size:cover;
    background-position:center;
    box-shadow:0 3px 10px rgba(0,0,0,0.2);
}

.login{
    width:350px;
    background:white;
    padding:35px;
    border-radius:15px;
    border:2px solid blue;
}

.login h2{
    text-align:center;
    margin-bottom:25px;
    color:#2563eb;
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box input{
    width:100%;
    padding:12px 40px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}

.input-box i{
    position:absolute;
    left:12px;
    top:13px;
    color:gray;
}

button{
    width:100%;
    padding:12px;
    background:#2563eb;
    color:white;
    border:none;
    border-radius:8px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#1e40af;
}

.extra{
    margin-top:15px;
    text-align:center;
}

.extra a{
    text-decoration:none;
    color:#2563eb;
}

@media (max-width:600px){

    nav{
        flex-direction:column;
        height:auto;
        padding:15px;
        gap:10px;
    }

    nav ul{
        gap:15px;
        flex-wrap:wrap;
        justify-content:center;
    }

    .container{
        height:auto;
        min-height:100vh;
        padding:20px;
    }

    .login{
        width:100%;
        max-width:350px;
        padding:25px;
    }

    .login h2{
        font-size:24px;
    }

    button{
        font-size:16px;
    }
}
</style>
</head>

<body>

<nav>
    <h2>CodeVerse</h2>

    <ul>
        <li><a href="#">HOME</a></li>
        <li><a href="#">ABOUT</a></li>
        <li><a href="#">CONTACT</a></li>
    </ul>

    <div class="notification">
        <i class="fa-solid fa-bell fa-shake"></i>
        <span class="badge">5</span>
    </div>
</nav>
<!-- <form action="/login" method="get">  get is used to get data from server 
    <button type="submit">submit</button> post is to send data to backend &send it to database
    <input type="email" name="email-id">//name is essential for key-value pair
</form> -->
<div class="container">
    <div class="login">

        <h2>Login</h2>

        <div class="input-box">
            <abbr title="name should be capital">
                <i class="fa-solid fa-user"></i>
            </abbr>

            <input type="text" placeholder="Username">
        </div>

        <div class="input-box">
            <abbr title="password should be of 8 digits">
                <i class="fa-solid fa-lock"></i>
            </abbr>

            <input type="password" placeholder="Password">
        </div>

        <button>Login</button>

        <div class="extra">
            <p><a href="#">Forgot Password?</a></p>
            <br>
            <p>New User? <a href="#">Register</a></p>
        </div>

    </div>
</div>

<script>

</script>

</body>
</html>
