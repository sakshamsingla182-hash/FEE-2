
 <!DOCTYPE html>
<html>
<head>
    <title>Funny Coding Meme</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(to right,#10fed2,#032bdf);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .meme{
            width:400px;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 8px 20px rgba(0,0,0,0.3);
            transition:0.4s;
            text-align:center;
        }

        .meme:hover{
            transform:scale(1.25);
        }

        h1{
            background:#ffcc00;
            color:#000;
            padding:15px;
            font-size:30px;
            letter-spacing:2px;
            text-shadow:2px 2px 3px white;
        }

        h2{
            background:#333;
            color:white;
            padding:10px;
            font-size:22px;
        }

        img{
            width:100%;
            display:block;
            border-top:4px solid #333;
            border-bottom:4px solid #333;
        }

        .caption{
            background:#f4f4f4;
            color:#222;
            padding:18px;
            font-size:22px;
            font-weight:bold;
            line-height:1.5;
        }
    </style>

</head>

<body>

    <div class="meme">

        <h1>MY PYTHON🐍 CODING SKILLS😂</h1>

        <h2>BE LIKE...</h2>

        <img src="images (2).jpg" alt="Meme">

        <div class="caption">
            Me After Solving One Bug...<br>
    10 New Errors Enter the Chat
        </div>

    </div>

</body>
</html>
